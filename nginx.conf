upstream api_backend {
    ip_hash; # Ensures sticky sessions for WebSockets across the 3 replicas
    server backend:3000;
}

server {
    listen 80;
    server_name exam.tensors.in;

    # 1. Serve the React Application
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to the backend container
    # This maps exam.tensors.in/api/... -> backend:3000/...
    location /api/ {
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Handle Static Uploads from the backend
    location /uploads/ {
        proxy_pass http://api_backend/uploads/;
    }
}
